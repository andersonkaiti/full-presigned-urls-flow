service: full-presigned-urls-flow

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-east-1
  httpApi:
    cors: true
  environment:
    BUCKET_NAME:
      Ref: FullPresignedURLFlowBucket

package:
  individually: true

build:
  esbuild:
    minify: true
    sourcemap: false

functions:
  getPresignedUrl:
    handler: src/functions/get-presigned-url.handler
    events:
      - httpApi:
          path: /
          method: POST

resources:
  Resources:
    FullPresignedURLFlowBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: full-presigned-urls-flow
